name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly audit of main even when nothing is pushed: new RustSec advisories
  # land against an unchanged Cargo.lock, and push-only CI let a batch of them
  # sit unnoticed for weeks. Only the `audit` job runs on the schedule.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: CI only reads the repo. Jobs that need more must ask for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CI never runs dx, so a Dependabot bump of `dioxus` in Cargo.lock would
      # otherwise leave the Dockerfile's pinned dx CLI behind (dx then logs
      # "dx and dioxus versions are incompatible!" and builds anyway).
      - name: dx matches dioxus
        run: |
          set -eu
          dx=$(sed -n 's/^ARG DX_VERSION=//p' Dockerfile)
          # The version line right after `name = "dioxus"` exactly (not
          # dioxus-core etc.); one line per locked copy of the crate.
          lock=$(awk 'prev == "name = \"dioxus\"" && $1 == "version" { v = $3; gsub(/"/, "", v); print v } { prev = $0 }' Cargo.lock)
          if [ -z "$dx" ] || [ -z "$lock" ]; then
            echo "Could not read DX_VERSION from Dockerfile ('$dx') or the dioxus version from Cargo.lock ('$lock')." >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$lock" | wc -l)" -ne 1 ]; then
            echo "Cargo.lock has more than one dioxus version: $(echo $lock) — dedupe it so DX_VERSION has one version to match." >&2
            exit 1
          fi
          if [ "$dx" != "$lock" ]; then
            echo "Dockerfile DX_VERSION=$dx but Cargo.lock has dioxus $lock — bump DX_VERSION and both DX_SHA256_* in the Dockerfile (see the comment there)." >&2
            exit 1
          fi
          echo "dx $dx matches dioxus $lock"
      # Pinned to a commit on dtolnay/rust-toolchain's master branch (its README
      # requires master-history SHAs — the per-toolchain branches like `stable`
      # get rewritten and their commits garbage-collected), with the toolchain
      # passed as an input instead of via the branch name.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Plain cargo-audit instead of rustsec/audit-check: no GitHub Checks API
      # call (so no `checks: write` permission needed) and no deprecated Node
      # runtime. Accepted advisories live in .cargo/audit.toml.
      # Pinned to a release SHA, tool passed as input. Per install-action's
      # README, pinning the release also pins the cargo-audit version it
      # installs (checksum-verified from rustsec's GitHub release); don't pin the
      # moving `@cargo-audit` tag by SHA. fallback: none = fail rather than
      # silently fall back to cargo-binstall (which would get the GITHUB_TOKEN).
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit
          fallback: none
      - name: Audit
        run: cargo audit
