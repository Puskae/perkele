# Keeps the supply-chain pins fresh: SHA-pinned GitHub Actions, digest-pinned
# Dockerfile base images, and Cargo.lock. Weekly and with a small open-PR cap so
# it stays reviewable for a one-person project. Dependabot rewrites the SHA and
# the trailing `# vX.Y.Z` comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The direct password-hash dependency only exists to switch on the
      # `getrandom` feature of the copy argon2 uses (see
      # crates/server/Cargo.toml). A major bump adds a second, unused copy and
      # quietly drops that feature. Move it together with argon2 by hand.
      - dependency-name: password-hash
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
