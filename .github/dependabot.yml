# Keeps the supply-chain pins fresh: SHA-pinned GitHub Actions, digest-pinned
# Dockerfile base images, and Cargo.lock. Weekly and with a small open-PR cap so
# it stays reviewable for a one-person project. Dependabot rewrites the SHA and
# the trailing `# vX.Y.Z` comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
